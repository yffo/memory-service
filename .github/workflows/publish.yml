name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # npm Trusted Publisher（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 不设 registry-url：setup-node 会写入占位 token，反而挡住 OIDC 认证
          node-version: 22

      # Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@11

      - name: 版本与 token 自检
        run: |
          node --version && npm --version
          node -e "const p=require('./package.json');console.log(p.name, p.version, p.mcpName||'')"
          test -z "${NODE_AUTH_TOKEN:-}" || { echo "NODE_AUTH_TOKEN 不该存在（应走 OIDC）"; exit 1; }

      - name: 测试
        # 固定时区：`parseTime` 的「不带时区 = 本机时区」语义在 UTC 机器上无实验条件
        # （本地时间与 UTC 相等，性质退化成恒等式）。+08:00 是项目的部署时区。
        env:
          TZ: Asia/Shanghai
        run: npm test

      - name: 发布（OIDC Trusted Publisher）
        run: |
          npm config set registry https://registry.npmjs.org/
          npm publish --access public --provenance
